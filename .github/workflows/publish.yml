name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out released source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js for npm Trusted Publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require the release tag to match package.json
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"

      - name: Install locked dependencies
        run: npm ci

      - name: Validate and build
        run: |
          npm run validate
          npm run build

      - name: Verify npm 11.17 publish metadata and npx tarball contract
        run: npm run verify:npm

      - name: Check whether this exact version already exists
        id: registry
        run: |
          PACKAGE_SPEC="$(node -p "const p=require('./package.json'); p.name+'@'+p.version")"
          if npm view "$PACKAGE_SPEC" version --json >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish public package with OIDC provenance
        if: steps.registry.outputs.exists != 'true'
        run: npx --yes --package npm@11.17.0 npm publish --access public
